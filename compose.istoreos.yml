name: option-edge

services:
  option-radar:
    build:
      context: .
      dockerfile: Dockerfile
    image: option-edge:local
    container_name: option-edge
    command:
      - option-radar
      - --host
      - 0.0.0.0
      - --port
      - "8790"
      - --refresh
      - "${OPTION_RADAR_REFRESH:-10}"
      - --risk-free-rate
      - "${OPTION_RADAR_RISK_FREE_RATE:-0.015}"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${OPTION_RADAR_BIND:-127.0.0.1}:8790:8790"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/live', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 15s

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:v1.94.1
    container_name: option-edge-tailscale
    hostname: option-edge
    network_mode: service:option-radar
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/istoreos/tailscale:/config:ro
    restart: unless-stopped
    depends_on:
      option-radar:
        condition: service_healthy

  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: option-edge-cloudflared
    network_mode: service:option-radar
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    restart: unless-stopped
    depends_on:
      option-radar:
        condition: service_healthy

volumes:
  tailscale-state:
